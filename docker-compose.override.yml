# Surcharges pour l'environnement de développement.
# Chargé automatiquement par Docker Compose en plus de docker-compose.yml.
# Ne pas committer de secrets dans ce fichier.

services:

  db:
    ports:
      - "1433:1433"

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: deps
    ports:
      - "8000:8000"
    volumes:
      - ./sir-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development

  worker:
    build:
      target: deps
    volumes:
      - ./sir-backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=debug --concurrency=2

  frontend:
    build:
      target: deps
    ports: !override
      - "4210:4200"
    volumes:
      - ./sir-frontend:/app
      - /app/node_modules
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 500
