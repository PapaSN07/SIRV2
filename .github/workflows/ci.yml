name: CI

on:
  push:
    branches: [main, develop, dev, SIR_MSENE, "fix/**", "feat/**"]
  pull_request:
    branches: [main, develop, dev, SIR_MSENE]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sir-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sir-backend/requirements.txt
      - name: Pilote ODBC (requis à l'import de pyodbc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint (ruff, config sir-backend/ruff.toml)
        run: ruff check app tests
      - name: Tests (unitaires + intégration, DB et Redis simulés)
        run: pytest tests -q --tb=short -o addopts=""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sir-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sir-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build (templates stricts)
        run: npm run build
