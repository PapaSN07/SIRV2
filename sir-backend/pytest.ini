[pytest]
# Mode asyncio automatique : tous les async def test_* sont exécutés avec pytest-asyncio
# sans avoir besoin du décorateur @pytest.mark.asyncio sur chaque fonction
asyncio_mode = auto

# Répertoire de tests
testpaths = tests

# Marqueurs personnalisés déclarés pour éviter les warnings
markers =
    asyncio: marque un test comme asyncio (géré automatiquement en mode auto)
    xfail: formules CRSE à confirmer avec l'équipe SENELEC

# Affichage verbeux par défaut
addopts = -v --tb=short

# Les variables d'environnement de test sont injectées via le conftest.py racine
# (monkeypatch sur os.environ avant import de app.core.config).
# Ne pas mettre de vraies URLs de DB ou Redis ici.
