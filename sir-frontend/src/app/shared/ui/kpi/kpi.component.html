<article class="kpi" [attr.aria-label]="libelle()">
  <p class="kpi__libelle">
    {{ libelle() }}
    @if (aide()) {
      <button
        type="button"
        class="kpi__aide"
        [attr.aria-label]="'Aide : ' + libelle()"
        [attr.aria-expanded]="aideOuverte()"
        [attr.aria-describedby]="aideOuverte() ? idAide : null"
        (click)="aideOuverte.set(!aideOuverte())"
        (blur)="aideOuverte.set(false)"
        (keydown.escape)="aideOuverte.set(false)"
      >
        <span class="material-symbols-outlined" aria-hidden="true">info</span>
      </button>
    }
  </p>
  @if (aide() && aideOuverte()) {
    <p class="kpi__bulle" role="tooltip" [id]="idAide">{{ aide() }}</p>
  }
  <p class="kpi__valeur">
    {{ valeur() }}
    @if (unite()) {
      <span class="kpi__unite">{{ unite() }}</span>
    }
  </p>
  @if (tendance(); as t) {
    <p [class]="'kpi__ecart kpi__ecart--' + t">
      <span class="kpi__ecart-val">
        <span class="material-symbols-outlined" aria-hidden="true">{{ icone() }}</span>
        {{ ecartTexte() }}
      </span>
      <span class="kpi__ecart-ref">vs période précédente</span>
    </p>
  }
  @if (detail()) {
    <p class="kpi__detail">{{ detail() }}</p>
  }
</article>
