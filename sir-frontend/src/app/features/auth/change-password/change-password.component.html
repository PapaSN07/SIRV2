<div class="login-page">
  <div class="login-page__atmosphere" aria-hidden="true">
    <div class="login-page__glow login-page__glow--top-left"></div>
    <div class="login-page__glow login-page__glow--bottom-right"></div>
  </div>

  <div class="login-shell">
    <header class="login-brand">
      <img
        class="login-brand__logo"
        src="assets/branding/senelec-logo.png"
        alt="SENELEC"
        width="220"
        height="48"
      />
      <h1 class="login-brand__title">Première connexion</h1>
      <p class="login-brand__subtitle">Définissez votre mot de passe personnel</p>
    </header>

    <div class="login-card">
      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label class="field__label" for="login">Matricule</label>
          <div class="field__input-wrap">
            <span class="material-symbols-outlined field__icon" aria-hidden="true">badge</span>
            <input id="login" class="field__input" type="text" formControlName="login" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="current_password">Mot de passe temporaire</label>
          <div class="field__input-wrap">
            <span class="material-symbols-outlined field__icon" aria-hidden="true">lock</span>
            <input
              id="current_password"
              class="field__input"
              [type]="hideCurrent ? 'password' : 'text'"
              formControlName="current_password"
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="new_password">Nouveau mot de passe</label>
          <div class="field__input-wrap">
            <span class="material-symbols-outlined field__icon" aria-hidden="true">key</span>
            <input
              id="new_password"
              class="field__input"
              [type]="hideNew ? 'password' : 'text'"
              formControlName="new_password"
              autocomplete="new-password"
            />
          </div>
          <p class="field__hint">8 caractères minimum</p>
        </div>

        <div class="field">
          <label class="field__label" for="confirm_password">Confirmer le mot de passe</label>
          <div class="field__input-wrap">
            <span class="material-symbols-outlined field__icon" aria-hidden="true">key</span>
            <input
              id="confirm_password"
              class="field__input"
              [type]="hideConfirm ? 'password' : 'text'"
              formControlName="confirm_password"
              autocomplete="new-password"
            />
          </div>
        </div>

        @if (errorMessage) {
          <p class="login-form__error" role="alert">{{ errorMessage }}</p>
        }

        <div class="login-form__actions">
          <button class="login-form__submit" type="submit" [disabled]="form.invalid || loading">
            @if (loading) {
              <span class="material-symbols-outlined login-form__spinner" aria-hidden="true">progress_activity</span>
              <span>Enregistrement…</span>
            } @else {
              <span>Enregistrer et continuer</span>
              <span class="material-symbols-outlined" aria-hidden="true">check</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
