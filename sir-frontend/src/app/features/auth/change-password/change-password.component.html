<div class="login-page">
  <div class="login-page__overlay" aria-hidden="true"></div>

  <div class="login-layout">
    <section class="login-hero">
      <h1 class="login-hero__title">SIR</h1>
      <p class="login-hero__heading">Première connexion</p>
      <p class="login-hero__org">Direction Principale Réseau</p>
      <p class="login-hero__desc">
        Définissez votre mot de passe personnel pour accéder au Système d'Information Réseau.
      </p>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <img
          class="login-card__logo"
          src="assets/branding/senelec-logo.png"
          alt="SENELEC"
          width="200"
          height="44"
        />

        <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="field">
            <label class="field__label" for="login">Matricule</label>
            <input id="login" class="field__input" type="text" formControlName="login" autocomplete="username" />
          </div>

          <div class="field">
            <label class="field__label" for="current_password">Mot de passe temporaire</label>
            <input
              id="current_password"
              class="field__input"
              [type]="hideCurrent ? 'password' : 'text'"
              formControlName="current_password"
              autocomplete="current-password"
            />
          </div>

          <div class="field">
            <label class="field__label" for="new_password">Nouveau mot de passe</label>
            <input
              id="new_password"
              class="field__input"
              [type]="hideNew ? 'password' : 'text'"
              formControlName="new_password"
              autocomplete="new-password"
            />
            <p class="field__hint">8 caractères minimum</p>
          </div>

          <div class="field">
            <label class="field__label" for="confirm_password">Confirmer le mot de passe</label>
            <input
              id="confirm_password"
              class="field__input"
              [type]="hideConfirm ? 'password' : 'text'"
              formControlName="confirm_password"
              autocomplete="new-password"
            />
          </div>

          @if (errorMessage) {
            <p class="login-form__error" role="alert">{{ errorMessage }}</p>
          }

          <button class="login-form__submit" type="submit" [disabled]="form.invalid || loading">
            @if (loading) {
              <span class="material-symbols-outlined login-form__spinner" aria-hidden="true">progress_activity</span>
              <span>Enregistrement…</span>
            } @else {
              <span>Enregistrer et continuer</span>
            }
          </button>
        </form>
      </div>
    </section>
  </div>

  <footer class="login-footer">
    <p class="login-footer__copyright">© 2026 SENELEC — Direction Principale Réseau</p>
  </footer>
</div>
