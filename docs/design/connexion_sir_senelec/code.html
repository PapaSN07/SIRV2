<!DOCTYPE html>

<html class="h-full" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connexion - SIR Senelec</title>

                        "on-tertiary-fixed": "#321300",

                        "inverse-on-surface": "#ebf1fa",

                        "secondary-fixed": "#e1e3e4",

                        "on-secondary": "#ffffff",

                        "surface-dim": "#d4dbe3",
                        "on-primary-container": "#a4caff",
                        "tertiary-fixed-dim": "#ffb68a",
                        "outline-variant": "#c1c7d2",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2a3138",
                        "primary-fixed-dim": "#a2c9ff",
                        "on-tertiary-fixed-variant": "#743500",
                        "background": "#f6f9ff",
                        "surface-variant": "#dce3ec",
                        "on-tertiary-container": "#ffb88c",
                        "on-primary-fixed-variant": "#004881",

                        "on-surface-variant": "#414750",
                        "secondary-container": "#e1e3e4",

                        "surface-container-highest": "#dce3ec",

                    },
                    "borderRadius": {

                    },

                    "fontFamily": {

        }

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #E9ECEF;
        }
        .prime-input-container {
            position: relative;
            transition: all 0.2s ease;
        }
        .prime-input-container:focus-within {
            transform: translateY(-1px);
        }
        .login-bg {
            background: linear-gradient(135deg, #f6f9ff 0%, #e8eef7 100%);
        }
    </style>
</head>
<body class="h-full login-bg text-on-surface flex items-center justify-center p-container-padding">
<!-- Background Pattern/Atmosphere -->
<div class="fixed inset-0 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
</div>
<!-- Main Content Shell -->
<div class="w-full max-w-[440px] relative z-10 animate-fade-in">
<!-- Brand Header Section -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center p-stack-sm mb-stack-md">
<span class="material-symbols-outlined text-primary text-[48px] mr-2" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-display-sm text-display-sm font-extrabold text-primary tracking-tighter">SENELEC</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">SIR Senelec</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Système d'Information de Réseau</p>
</div>
<!-- Professional Login Card -->
<div class="login-card rounded-lg p-10 shadow-sm">
<form class="space-y-stack-lg" onsubmit="return false;">
<!-- Matricule Field (PrimeNG style) -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="matricule">Matricule (Employee ID)</label>
<div class="prime-input-container flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary overflow-hidden">
<span class="material-symbols-outlined px-stack-md text-outline">badge</span>
<input class="w-full h-12 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="matricule" name="matricule" placeholder="Ex: SNL-12345" type="text"/>
</div>
</div>
<!-- Password Field (PrimeNG style) -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Mot de passe</label>
</div>
<div class="prime-input-container flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary overflow-hidden">
<span class="material-symbols-outlined px-stack-md text-outline">lock</span>
<input class="w-full h-12 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="px-stack-md text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Action Section -->
<div class="pt-stack-sm space-y-stack-md">
<button class="w-full h-12 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-stack-sm shadow-md" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
<div class="text-center">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">
                            Mot de passe oublié ?
                        </a>
</div>
</div>
</form>
</div>
<!-- Footer Help -->
<div class="mt-stack-lg text-center space-y-2">
<p class="font-label-md text-label-md text-on-surface-variant opacity-75">
                © 2024 Senelec. Tous droits réservés.
            </p>
<div class="flex items-center justify-center gap-stack-md text-outline font-label-md text-label-md">
<a class="hover:text-primary transition-colors" href="#">Support technique</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Politique de confidentialité</a>
</div>
</div>
</div>
<!-- Interactive script for minor feedback -->
<script>
        document.querySelector('form').addEventListener('submit', function() {
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Authentification...';
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simulating a delay for the professional feel
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                // Normally here would be the redirect
            }, 1500);
        });

        // Toggle Password visibility
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            togglePass.querySelector('.material-symbols-outlined').textContent = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
